<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/images/profile-mark.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳至正文</a>
    <header class="site-header">
      <div class="frame header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" lang="en">
          <img src="{{ '/assets/images/profile-mark.png' | relative_url }}" width="32" height="32" alt="">
          About Me
        </a>
        <nav class="main-nav" aria-label="主导航">
          {% for link in site.data.navigation.main %}
            <a href="{{ link.url | relative_url }}"{% if link.url == page.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          {% endfor %}
        </nav>
        <a class="contact-link" href="#contact"><i class="icon icon-mail" aria-hidden="true"></i>联系我</a>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer" id="contact">
      <div class="frame footer-inner">
        <div>
          <h2>联系我</h2>
          <a class="email-address" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        </div>
        <div class="footer-social">
          <a href="https://github.com/{{ site.author.github }}">GitHub</a>
          <a href="https://blog.csdn.net/weixin_48435461">CSDN</a>
          <a href="{{ '/images/wechat.jpg' | relative_url }}">微信</a>
        </div>
      </div>
      <div class="frame copyright">© {{ site.time | date: '%Y' }} Shiyang Huang</div>
    </footer>
  </body>
</html>
