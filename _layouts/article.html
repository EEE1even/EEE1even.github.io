---
layout: profile
---
<article class="frame article-page">
  <header class="article-header">
    {% if page.resume_pdf %}<p class="eyebrow" lang="en">Curriculum vitae</p>{% endif %}
    <h1>{{ page.title | escape }}</h1>
    {% if page.resume_pdf %}
      <div class="cv-intro">
        <p>{{ site.author.name }} <span lang="en">Shiyang Huang</span></p>
        <a class="button primary" href="{{ page.resume_pdf | relative_url }}" download><i class="icon icon-file" aria-hidden="true"></i>下载 PDF 简历</a>
      </div>
      <p class="cv-updated">履历资料截至 {{ page.data_as_of }}</p>
    {% endif %}
  </header>
  <div class="article-content">{{ content }}</div>
</article>
